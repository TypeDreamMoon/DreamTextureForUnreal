; DreamTextureForUnreal test host -- engine config.
;
; This host stands in for the working project you normally develop in. It is built against the Launcher engine,
; so a build here never waits on your working project's Build.bat mutex or touches its engine binaries.
; The render and shader settings below mirror a typical modern working project (Substrate, DX12 SM6). Several of
; them feed the shader cache keys: a host that agrees with your working project on these keys reads its
; already-warm derived data cache instead of compiling every shader again on its first launch. If your own project
; differs, copy these sections from your project's Config/DefaultEngine.ini (the host then shares its cache).
;
; There is deliberately no derived-data-cache section. On this engine the cache that is actually read and
; written is the local Zen store, which is machine-wide rather than per project (BaseEngine.ini,
; [Zen.AutoLaunch] DataPath and the ue.ddc namespace). Leaving the cache graph alone is what makes this host
; share your working project's cache -- anything written here could only split the two.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships that still gives the editor a level: one PlayerStart. A working project
; usually starts on a full level, which every automation run -- -nullrhi included -- would load before its first test.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; These feed the shader map keys; one value different from your working project and the first
; launch compiles its shaders from nothing.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.EarlyZPassOnlyMaterialMasking=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.CustomDepth=3
r.RayTracing.Shadows=True
r.Mobile.AntiAliasing=4
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; The RHI and the targeted shader formats decide which shader platform the editor
; compiles for, and the platform is part of every shader cache key.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[DevOptions.Shaders]
; Same machine as your working project, so the same share of cores is left to the shader compile workers.
PercentageUnusedShaderCompilingThreads=25
