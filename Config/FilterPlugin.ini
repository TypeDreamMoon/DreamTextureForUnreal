[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

/README.md
/README.zh-CN.md
/LICENSE
/CHANGELOG.md
/Docs/...
/Images/...

; Localization resources: the .locmeta and the per-culture .locres (generated by Tools/Localization/build_locres.py).
; BuildPlugin already includes all of /Content/... by default; listing it here keeps the release from depending on that default.
; The descriptor's LocalizationTargets entry points at this folder, and a missing one is silent: no error, just no Chinese.
/Content/Localization/...
